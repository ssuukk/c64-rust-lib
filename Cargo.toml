[package]
name = "c64-rust-lib"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "reu",
    "plotek",
    "ultimate64",
    "demo",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
lto = false
opt-level = 2
debug = 2
codegen-units = 16
incremental = false

[profile.release]
opt-level = "s"
lto = false
strip = true
panic = "abort"
debug = 0

[patch.crates-io]
ufmt = {git="https://github.com/mrk-its/ufmt", branch="ptr_width_16_fix"}
ufmt-write = {git="https://github.com/mrk-its/ufmt", branch="ptr_width_16_fix"}
mos-hardware = { path = "vendor/mos-hardware" }

[dependencies]
reu = { path = "./reu" }
plotek = { path = "./plotek" }
ultimate64 = { path = "./ultimate64" }

ufmt-stdio = "0.4.0" # https://docs.rs/ufmt-stdio/0.4.0/ufmt_stdio/
mos-hardware = { version = "0.4.0", default-features = false, features = ["c64", "cx16", "bindgen"] }
mos-alloc = "0.2" # https://docs.rs/mos-alloc/0.2.0/mos_alloc/
static_assertions = "1.1"
bitflags = "2.6.0"
volatile-register = "0.2"
volatile = "0.6.1"
#rust = { features = ["asm_experimental_arch"] }

[build-dependencies]
cc = "1.1.15"
home = "0.5.10"  # Pin home to version before edition2024
#bindgen = { version = "0.70.1", optional = true }

[[bin]]
name = "demo"
path = "./demo/src/main.rs"