[package]
name = "ultimate64"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mos-hardware = { version = "0.4.0", default-features = false, features = ["c64", "cx16", "bindgen"] }
bitflags = "2.6.0"
static_assertions = "1.1"
volatile-register = "0.2"

[lib]
path = "src/lib.rs"
